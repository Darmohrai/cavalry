apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: vadym-cavalry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          args: ["start-dev", "--import-realm"]
          envFrom:
            - secretRef:
                name: cavalry-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: vadym-cavalry
spec:
  ports:
    - port: 8080
  selector:
    app: keycloak