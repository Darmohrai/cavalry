spring:
  application:
    name: cavalry
  datasource:
    url: jdbc:postgresql://localhost:5433/ev_charge_db
    username: root
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ev-network
      client:
        registration:
          keycloak:
            client-id: ev-frontend
            client-secret: secret
            scope: openid, profile, email
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/ev-network

server:
  port: 8082